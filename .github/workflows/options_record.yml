name: Pre-open update

# 03.11.2026 (т. 10): обновяването преди отварянето (src/preopen.py) — в 09:05 Ню Йорк, отделно от сутрешния бриф. Без AI; имейл само ако има нещо.
# 17.11.2026 (пакет 1, т. 2в — решение след стратегическия преглед): записът на опционните данни (src/options_record.py, data/options_daily.json) — махнат; пускането
# остава САМО за обновяването. Името на файла (options_record.yml) не се сменя — cron-job.org пуска workflow_dispatch по него.
#
# Пуска се САМО през cron-job.org (workflow_dispatch). Часовата зона на задачата там не може да се смени (Europe/Berlin), затова графикът е „5 14,15 * * 1-5“ по
# Берлин — две пускания на ден, от които точно едното е в 09:05 Ню Йорк: до 01.11 — 14:05 Берлин (= 09:05 EDT), след 01.11 — 15:05 Берлин (= 09:05 EST); при пролетните
# смени е същото. Другото пускане (10:05 или 08:05 ET) прескача в preopen.skip_reason — след отварянето (≥ 09:30 Ню Йорк) или преди прозореца (< 09:00 Ню Йорк);
# също ден без сесия (за секунди). Без schedule: нарочно — прозорецът е 25 мин, а вграденият scheduler на GitHub закъснява в това репо с часове.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Собствена група: не отменя бриф.
concurrency:
  group: options-record
  cancel-in-progress: false

jobs:
  preopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-open update
        id: preopen
        env:
          EDGAR_UA: ${{ secrets.EDGAR_UA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python src/preopen.py

      - name: Commit pre-open
        if: always()
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@github.com"
          git add data/preopen docs/index.html 2>/dev/null || true          # 03.11.2026: обновяването преди отварянето (данните и страницата с карето)
          git diff --cached --quiet && exit 0
          git commit -m "options record / pre-open: $(date -u +%F)"
          # Само обновяването преди отварянето се качва оттук; всичко друго, писано по време на run-а, се слага настрана, после pull --rebase с до 4 опита.
          git stash push --include-untracked -q -m "options-record: локални файлове" || true
          for attempt in 1 2 3 4; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push опит $attempt от 4 неуспешен — повторен опит след пауза"
            sleep $((attempt * ${RETRY_DELAY:-5}))
          done
          echo "::error::обновяването преди отварянето не успя да се качи след 4 опита (pull --rebase / push)"
          exit 1
