name: Unusual Options OI snapshot

# FIX 2026-09-29: следобедна снимка на open interest за сутрешния бриф — виж
# src/oi_snapshot.py. В 05:30–05:55 UTC Yahoo връща празен/непълен OI; следобед
# в деня на сесията OI е пълен и отразява началото на сесията.
#
# За разлика от daily_brief.yml тук има schedule: прозорецът е широк (всеки
# час между 09:30 и 16:00 Ню Йорк = 13:30–20:00 UTC през лятото, 14:30–21:00 през зимата дава същия OI), затова закъснение на GitHub
# scheduler-а с до час не вреди, а пропуснат run само скрива съотношението
# на следващата сутрин (с изрично обяснение). workflow_dispatch — за ръчно
# пускане или ако се премине към cron-job.org като при брифа.
#
# 12.10.2026 — резерва В КОДА за dispatch-а от cron-job.org (~16:00 UTC): още schedule тригери, така че ако той падне, да има втори и трети
# шанс преди прага (16:00 Ню Йорк = 20:00 UTC лете / 21:00 UTC зиме), автоматично. Валиден прозорец: 09:30–16:00 Ню Йорк = 13:30–20:00 UTC (EDT),
# 14:30–21:00 UTC (EST, от 01.11). Run извън прозореца или при вече взета пълна снимка прескача за секунди (oi_snapshot._skip_reason, ред ::notice::).
# Измерено закъснение на GitHub scheduler-а в това репо (час на run-а − час в cron-а):
#   "0 15" (oi_snapshot, 30.09–09.10, 8 от 8 пуснати): 4ч51м–6ч56м → run-ове 19:51–21:56 UTC (в летния прозорец — 2 от 8);
#   "30 5"/"30 6" (daily_brief, 15.06–22.06): 10ч49м–14ч25м, и 4 от 8 слота изобщо не са пуснати.
# GitHub сочи началото на часа като пиково натоварване — новите са на "нечетни" минути. Покритие (поне един run в прозореца; проверява го
# test_oi_schedule.py): при октомврийските закъснения 09:47 и 12:17 → 8/8 и лете, и зиме; при юнските 05:47 → 3/4 лете, 4/4 зиме;
# ако тръгнат навреме — 15:00 и 17:37 (05:47–12:17 прескачат преди отварянето).
on:
  schedule:
    - cron: "47 5 * * 1-5"    # при закъснение 10–14 ч (юни) → 16:36–20:12 UTC
    - cron: "47 9 * * 1-5"    # при закъснение ~5 ч (октомври) → 14:38–16:43 UTC
    - cron: "17 12 * * 1-5"   # при закъснение ~5 ч → 17:08–19:13 UTC
    - cron: "0 15 * * 1-5"    # 15:00 UTC, пон–пет (11:00 EDT / 10:00 EST) — досегашният; навреме — в прозореца
    - cron: "37 17 * * 1-5"   # навреме → 13:37 EDT / 12:37 EST — трети шанс след dispatch-а
  workflow_dispatch: {}

permissions:
  contents: write

# 12.10.2026: СОБСТВЕНА група (досега "daily-brief", общата с брифа). В обща група нов чакащ run отменя по-стария чакащ — закъснял OI run около 05:30 UTC
# (GitHub пуска schedule тригерите с часове закъснение) можеше да отмени ЧАКАЩ бриф. Сега OI run не може да отмени бриф; два OI run-а пак не вървят едновременно.
# Едновременно качване с брифа се покрива от повторните опити в двата job-а: тук stash + pull --rebase (commit-ва се САМО снимката), в брифа pull --rebase
# (docs/ и data/ — снимката той само чете) → различни файлове, rebase без конфликт (test_workflow_concurrency.py пуска двата скрипта и паралелно).
concurrency:
  group: oi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 13.10.2026: закрепено на 24.04 — ubuntu-latest минава на Ubuntu 26 от 19.10.2026 (анотация на GitHub в run-овете)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take OI snapshot
        run: python src/oi_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@github.com"
          git add data/unusual_options_oi_snapshot.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "oi snapshot: $(date -u +%F)"
          # FIX 2026-10-10 (К1): от 08.10 (UOV кошницата) снимката пише и кешовете, които git следи
          # (unusual_options_volume_rank_cache.json, sp500_ndx_universe.json) → "cannot pull with rebase: You have
          # unstaged changes" и job-ът пада с код 128 (run 37955976842, 09.10; сесията 09.10 е загубена). Кешовете
          # НЕ се качват оттук — сутрешният бриф ги преизчислява и commit-ва (git add docs/ data/); ако и двата job-а
          # ги пишат, rebase-ът може да удари конфликт. Слагат се настрана, а после pull --rebase с до 4 опита като
          # в daily_brief.yml; след 4-те опита стъпката пада видимо вместо да мълчи.
          git stash push --include-untracked -q -m "oi-snapshot: локални кешове" || true
          for attempt in 1 2 3 4; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push опит $attempt от 4 неуспешен — повторен опит след пауза"
            sleep $((attempt * ${RETRY_DELAY:-5}))
          done
          echo "::error::OI снимката не успя да се качи след 4 опита (pull --rebase / push)"
          exit 1
