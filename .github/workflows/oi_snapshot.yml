name: Unusual Options OI snapshot

# FIX 2026-09-29: следобедна снимка на open interest за сутрешния бриф — виж
# src/oi_snapshot.py. В 05:30–05:55 UTC Yahoo връща празен/непълен OI; следобед
# в деня на сесията OI е пълен и отразява началото на сесията.
#
# За разлика от daily_brief.yml тук има schedule: прозорецът е широк (всеки
# час между 09:30 и 16:00 Ню Йорк = 13:30–20:00 UTC през лятото, 14:30–21:00 през зимата дава същия OI), затова закъснение на GitHub
# scheduler-а с до час не вреди, а пропуснат run само скрива съотношението
# на следващата сутрин (с изрично обяснение). workflow_dispatch — за ръчно
# пускане или ако се премине към cron-job.org като при брифа.
on:
  schedule:
    - cron: "0 15 * * 1-5"    # 15:00 UTC, пон–пет (11:00 EDT / 10:00 EST)
  workflow_dispatch: {}

permissions:
  contents: write

# същата група като брифа — двата job-а никога не push-ват едновременно
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take OI snapshot
        run: python src/oi_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@github.com"
          git add data/unusual_options_oi_snapshot.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "oi snapshot: $(date -u +%F)"
          # FIX 2026-10-10 (К1): от 08.10 (UOV кошницата) снимката пише и кешовете, които git следи
          # (unusual_options_volume_rank_cache.json, sp500_ndx_universe.json) → "cannot pull with rebase: You have
          # unstaged changes" и job-ът пада с код 128 (run 37955976842, 09.10; сесията 09.10 е загубена). Кешовете
          # НЕ се качват оттук — сутрешният бриф ги преизчислява и commit-ва (git add docs/ data/); ако и двата job-а
          # ги пишат, rebase-ът може да удари конфликт. Слагат се настрана, а после pull --rebase с до 4 опита като
          # в daily_brief.yml; след 4-те опита стъпката пада видимо вместо да мълчи.
          git stash push --include-untracked -q -m "oi-snapshot: локални кешове" || true
          for attempt in 1 2 3 4; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push опит $attempt от 4 неуспешен — повторен опит след пауза"
            sleep $((attempt * ${RETRY_DELAY:-5}))
          done
          echo "::error::OI снимката не успя да се качи след 4 опита (pull --rebase / push)"
          exit 1
